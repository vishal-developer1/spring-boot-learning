<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Employee Management</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white d-flex
                    justify-content-between align-items-center flex-wrap gap-2">
            <h3 class="mb-0">Employee Management System</h3>

            <a th:href="@{/employees/new}"
               class="btn btn-light">
                + Add Employee
            </a>
        </div>

        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-bordered table-striped
                              table-hover align-middle mb-0">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="employee : ${employees}">
                        <td th:text="${employee.id}"></td>
                        <td th:text="${employee.name}"></td>
                        <td th:text="${employee.email}"></td>
                        <td th:text="${employee.department}"></td>

                        <td class="text-center text-nowrap">
                            <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                               class="btn btn-sm btn-warning me-1">
                                Edit
                            </a>

                            <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Are you sure you want to delete this employee?')">
                                Delete
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            No employees found. Click Add Employee to create one.
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>

        </div>

        <div class="card-footer text-muted">
            Total Employees:
            <span th:text="${#lists.size(employees)}">0</span>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
